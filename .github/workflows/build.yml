name: Build Maven

on:
  push:
    branches: [ 'sustaining/2.4.x','master', 'issues/**', 'features/**' ]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-maven:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        java: [ '11', '17', '21', '25', '27' ]
        include:
          - { os: 'macos-latest',   java: '11' }
          - { os: 'macos-latest',   java: '27' }
          - { os: 'windows-latest', java: '11' }
          - { os: 'windows-latest', java: '27' }
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: ${{ matrix.Java }}-${{ matrix.os }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'zulu'
    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
         path: ~/.m2/repository
         key: ${{ runner.os }}-m2-repository-${{ hashFiles('**/pom.xml') }}
         restore-keys: ${{ runner.os }}-m2-repository
    - name: Build with Maven
      env:
        MAVEN_OPTS: -Dhttps.protocols=TLSv1.2 -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true -Dmaven.wagon.http.retryHandler.count=10
      run: mvn --batch-mode --errors --update-snapshots verify --file pom.xml
